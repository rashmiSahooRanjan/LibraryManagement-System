<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login - Smart Library Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="member-login-page">
    <div class="member-login-container">
        <div class="member-login-box">
            <div class="member-login-header">
                <div class="library-icon">
                    <i class="fas fa-book"></i>
                </div>
                <h1>Library Portal</h1>
                <p>Login to access your library account</p>
            </div>

            <!-- Role Tabs -->
            <div class="role-tabs">
                <button class="role-tab active" data-role="student" onclick="switchRole('student')">
                    <i class="fas fa-user-graduate"></i> Student
                </button>
                <button class="role-tab" data-role="teacher" onclick="switchRole('teacher')">
                    <i class="fas fa-chalkboard-teacher"></i> Teacher
                </button>
                <button class="role-tab" data-role="librarian" onclick="switchRole('librarian')">
                    <i class="fas fa-user-tie"></i> Librarian
                </button>
            </div>

            <form id="memberLoginForm" class="login-form">
                <div class="form-group">
                    <label for="memberUsername">Username or Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="memberUsername" name="username" placeholder="Enter your username or email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="memberPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="memberPassword" name="password" placeholder="Enter your password" required>
                        <span class="toggle-password" onclick="toggleMemberPassword()">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="member-login-footer">
                <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
                <p>Are you an admin? <a href="{{ url_for('auth.login') }}">Admin Login</a></p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        let currentRole = 'student';

        function switchRole(role) {
            // Librarian accounts are admins - redirect to admin login
            if (role === 'librarian') {
                window.location.href = '/login';
                return;
            }
            
            currentRole = role;
            
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-role') === role);
            });
        }

        function toggleMemberPassword() {
            const passwordInput = document.getElementById('memberPassword');
            const icon = document.querySelector('.toggle-password i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('memberLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('memberUsername').value;
            const password = document.getElementById('memberPassword').value;

            try {
                const response = await fetch('/member/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        membership_type: currentRole
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/member/dashboard';
                    }, 1500);
                } else {
                    showToast(data.message || 'Login failed', 'error');
                }
            } catch (error) {
                showToast('An error occurred', 'error');
            }
        });

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
